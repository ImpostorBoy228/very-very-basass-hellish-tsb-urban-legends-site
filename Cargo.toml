[package]
name = "very-very-basass-hellish-tsb-urban-legends-site"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.6.2", features = ["fs"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
num-bigint = { version = "0.5.1", features = ["serde"] }
axum-governor = "2.0.4"

[build-dependencies]
cc = "1"
